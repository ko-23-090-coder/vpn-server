<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Демо — DiplomaVPN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { text-align: center; padding: 40px; max-width: 500px; }
        h1 { color: #4fc3f7; margin-bottom: 20px; font-size: 32px; }
        .step {
            background: #1a1a4e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .step-num {
            background: #1A237E;
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .step p { color: #cccccc; font-size: 20px; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ DiplomaVPN Demo</h1>

        <div class="step">
            <div class="step-num">1</div>
            <p>Установи приложение DiplomaVPN на Android</p>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <p>Войди: логин <b>admin</b>, пароль <b>1234</b></p>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <p>Введи SMS код из логов Railway</p>
        </div>
        <div class="step">
            <div class="step-num">4</div>
            <p>Пройди CAPTCHA</p>
        </div>
        <div class="step">
            <div class="step-num">5</div>
            <p>VPN подключится автоматически ✅</p>
        </div>
    </div>
</body>
</html>
